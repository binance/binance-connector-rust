name: Connectors CI/CD

on:
  pull_request:
    branches-ignore:
      - rc-**
  workflow_dispatch:

jobs:
  detect-targets:
    runs-on: ubuntu-latest
    outputs:
      modified_targets: ${{ steps.filter.outputs.modified_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test target detector
        run: |
          bash -n \
            .github/scripts/detect-modified-targets.sh \
            .github/scripts/resolve-diff-range.sh \
            .github/scripts/test-detect-modified-targets.sh
          bash .github/scripts/test-detect-modified-targets.sh

      - name: Detect modified targets
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          DIFF_RANGE="$(
            bash .github/scripts/resolve-diff-range.sh \
              --repo "$GITHUB_WORKSPACE" \
              --event-name "$EVENT_NAME" \
              --pull-request-base-sha "$PULL_REQUEST_BASE_SHA" \
              --pull-request-head-sha "$PULL_REQUEST_HEAD_SHA"
          )"
          read -r BASE_SHA HEAD_SHA <<<"$DIFF_RANGE"

          MODIFIED_TARGETS="$(
            bash .github/scripts/detect-modified-targets.sh \
              --repo "$GITHUB_WORKSPACE" \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
          )"
          jq -e 'type == "array" and all(.[]; type == "string")' \
            <<<"$MODIFIED_TARGETS" >/dev/null

          echo "Detected modified targets: $MODIFIED_TARGETS"
          printf 'modified_targets=%s\n' "$MODIFIED_TARGETS" >>"$GITHUB_OUTPUT"

  build-target:
    runs-on: ubuntu-latest
    needs: detect-targets
    if: ${{ needs.detect-targets.outputs.modified_targets != '[]' }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.detect-targets.outputs.modified_targets) }}
        rust-version: [1.90.0]
      max-parallel: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust ${{ matrix.rust-version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy
          rustflags: ""

      - name: Cache cargo registry & build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check
        run: |
          if [ -d "examples/${{ matrix.target }}" ]; then \
            find examples/${{ matrix.target }} -name "*.rs" -exec rustfmt --check -- {} +; \
          fi
          if [ -d "src/${{ matrix.target }}" ]; then \
            find src/${{ matrix.target }} -name "*.rs" -exec rustfmt --check -- {} +; \
          fi

      - name: Lint Check
        run: |
          TARGET="${{ matrix.target }}"
          if [ "$TARGET" = "common" ]; then
            cargo clippy --all-targets --no-default-features --features "openssl-tls"
            cargo clippy --all-targets --no-default-features --features "rustls-tls"
          else
            cargo clippy --all-targets --no-default-features --features "openssl-tls,$TARGET"
            cargo clippy --all-targets --no-default-features --features "rustls-tls,$TARGET"
          fi

      - name: Test
        run: |
          TARGET="${{ matrix.target }}"
          if [ "$TARGET" = "common" ]; then
            cargo test --no-default-features --features "openssl-tls"
            cargo test --no-default-features --features "rustls-tls"
          else
            cargo test --no-default-features --features "openssl-tls,$TARGET" "$TARGET"
            cargo test --no-default-features --features "rustls-tls,$TARGET" "$TARGET"
          fi
